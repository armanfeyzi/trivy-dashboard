name: Build & Push Docker Image

on:
  push:
    branches:
      - main
    paths:
      - "dashboard/**"
      - ".github/workflows/docker-publish.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/dashboard

jobs:
  build-and-push:
    name: Build & push dashboard image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write   # needed to push to GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Generate image metadata (tags + labels) ─────────────────────────────
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # short git SHA:  ghcr.io/armanfeyzi/trivy-dashboard/dashboard:sha-abc1234
            type=sha,prefix=sha-,format=short
            # rolling latest: ghcr.io/armanfeyzi/trivy-dashboard/dashboard:latest
            type=raw,value=latest

      # ── Log in to GitHub Container Registry ─────────────────────────────────
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Set up Buildx for efficient layer caching ────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Build and push ───────────────────────────────────────────────────────
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./dashboard
          file: ./dashboard/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layers between runs to speed up builds
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Print the image digest for easy reference ────────────────────────────
      - name: Image digest
        run: |
          echo "✅ Image pushed:"
          echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n' | sed 's/^/  /'
          echo "Digest: ${{ steps.build-push.outputs.digest }}"
